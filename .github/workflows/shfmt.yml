name: Shell formatting checks

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: runner / shfmt
    runs-on: [self-hosted, Linux, X64, dartnode-linux, dartnode-build]
    steps:
      - uses: actions/checkout@v4
      - uses: luizm/action-sh-checker@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHFMT_OPTS: "-s"
        with:
          sh_checker_shellcheck_disable: true # disable for now
    if: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) }}
