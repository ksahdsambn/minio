name: Healing Functional Tests

on:
  pull_request:
    branches:
      - master

# This ensures that previous jobs for the PR are canceled when the PR is
# updated.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Go ${{ matrix.go-version }} on ${{ matrix.os }}
    runs-on: ${{ startsWith((matrix.os), 'windows') && fromJSON('["self-hosted","Windows","dartnode-windows"]') || startsWith((matrix.os), 'macos') && fromJSON('["self-hosted","macOS","dartnode-macos"]') || fromJSON('["self-hosted","Linux","X64","dartnode-linux","dartnode-build"]') }}
    strategy:
      matrix:
        go-version: [1.24.x]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: Build on ${{ matrix.os }}
        if: matrix.os == 'ubuntu-latest'
        env:
          CGO_ENABLED: 0
          GO111MODULE: on
          MINIO_KMS_SECRET_KEY: "my-minio-key:oyArl7zlPECEduNbB1KXgdzDn2Bdpvvw0l8VO51HQnY="
          MINIO_KMS_AUTO_ENCRYPTION: on
        run: |
          test "$(sysctl -n net.ipv6.conf.all.disable_ipv6)" = 0
          test "$(sysctl -n net.ipv6.conf.default.disable_ipv6)" = 0
          make verify-healing
          make verify-healing-inconsistent-versions
          make verify-healing-with-root-disks
          make verify-healing-with-rewrite
    if: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) }}
